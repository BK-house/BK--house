<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BK House</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#222;
}

header{
  background:#1769aa;
  color:white;
  padding:20px;
  text-align:center;
}

.logo{
  font-size:32px;
  font-weight:bold;
}

.brand{
  font-size:22px;
  font-weight:bold;
  margin-top:4px;
}

.slogan{
  font-size:14px;
  margin-top:5px;
}

.account{
  background:white;
  margin:15px;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.account h2{
  margin-top:0;
  color:#1769aa;
}

.account input{
  width:100%;
  padding:11px;
  margin-bottom:8px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:15px;
}

.account button{
  width:100%;
  padding:11px;
  border:0;
  border-radius:7px;
  background:#1769aa;
  color:white;
  font-size:15px;
  margin-top:5px;
}

.logout{
  background:#777 !important;
}

#accountMessage{
  margin-top:10px;
  font-size:14px;
}

.dashboard{
  background:white;
  margin:15px;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.dashboard h2{
  color:#1769aa;
  margin-top:0;
}

.goalBox{
  background:#eef6fc;
  border-radius:10px;
  padding:15px;
  margin-top:10px;
}

.goalNumber{
  font-size:28px;
  font-weight:bold;
  color:#1769aa;
}

.goalMessage{
  margin-top:5px;
  font-size:14px;
}

.search{
  padding:15px;
  background:white;
}

.search input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

.categories{
  display:flex;
  gap:8px;
  padding:12px;
  overflow-x:auto;
  background:white;
}

.categories button{
  border:0;
  background:#e9eef3;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.categories button.active{
  background:#1769aa;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:15px;
}

.product{
  background:white;
  border-radius:10px;
  padding:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product h3{
  margin:0 0 8px;
  font-size:16px;
}

.price{
  color:#1769aa;
  font-weight:bold;
  margin-bottom:6px;
}

.stock{
  font-size:13px;
  color:#666;
  margin-bottom:5px;
}

.points{
  font-size:13px;
  color:#1769aa;
  margin-bottom:10px;
  font-weight:bold;
}

.product button{
  width:100%;
  border:0;
  background:#1769aa;
  color:white;
  padding:10px;
  border-radius:7px;
  cursor:pointer;
}

.product button:disabled{
  background:#aaa;
  cursor:not-allowed;
}

#ordersSection{
  padding:15px;
  background:white;
  margin-top:15px;
}

.orderCard{
  border:1px solid #ddd;
  border-radius:8px;
  padding:12px;
  margin-bottom:10px;
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:13px;
}

@media(max-width:500px){
  .products{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">BK</div>
  <div class="brand">BK House</div>
  <div class="slogan">La signature du bon goût</div>
</header>

<!-- COMPTE VENDEUR -->
<div class="account">

  <div id="loggedOut">

    <h2>Créer mon compte vendeur</h2>

    <input type="text" id="nameInput" placeholder="Nom et prénom">

    <input type="text" id="phoneInput" placeholder="Numéro WhatsApp">

    <input type="email" id="emailInput" placeholder="Adresse email">

    <input type="password" id="passwordInput" placeholder="Mot de passe">

    <button onclick="signUp()">
      Créer mon compte
    </button>

    <hr style="margin:18px 0">

    <h2>Déjà un compte ?</h2>

    <input type="email" id="loginEmail" placeholder="Adresse email">

    <input type="password" id="loginPassword" placeholder="Mot de passe">

    <button onclick="signIn()">
      Se connecter
    </button>

  </div>

  <div id="loggedIn" style="display:none">

    <h2>Mon compte</h2>

    <div id="userInfo"></div>

    <button class="logout" onclick="signOut()">
      Se déconnecter
    </button>

  </div>

  <div id="accountMessage"></div>

</div>

<!-- OBJECTIF -->
<div class="dashboard" id="dashboard" style="display:none">

  <h2>Mon objectif</h2>

  <div class="goalBox">

    <div>
      Ventes aujourd'hui
    </div>

    <div class="goalNumber" id="todaySales">
      0 / 3
    </div>

    <div class="goalMessage" id="goalMessage">
      Encore 3 ventes pour atteindre ton objectif.
    </div>

    <div style="margin-top:12px">
      Points : <strong id="dashboardPoints">0</strong>
    </div>

  </div>

</div>

<!-- RECHERCHE -->
<div class="search">

  <input
    type="text"
    id="searchInput"
    placeholder="Rechercher un article..."
    oninput="searchProducts()"
  >

</div>

<!-- CATEGORIES -->
<div class="categories">

  <button
    class="active"
    onclick="filterProducts('Tout',this)">
    Tout
  </button>

  <button
    onclick="filterProducts('Homme',this)">
    Homme
  </button>

  <button
    onclick="filterProducts('Femme',this)">
    Femme
  </button>

  <button
    onclick="filterProducts('Accessoires',this)">
    Accessoires
  </button>

</div>

<!-- PRODUITS -->
<div class="products" id="products"></div>

<!-- COMMANDES -->
<div id="ordersSection">

  <h2>Mes commandes</h2>

  <div id="ordersList">
    Connecte-toi pour voir tes commandes.
  </div>

</div>

<footer>
  © 2026 BK House
</footer>

<script>

const SUPABASE_URL =
"https://guutggkqdmolyklhdfrw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rpU7ZA6E0q2d7nzp97K6yg_FpoFjRNi";

let accessToken =
localStorage.getItem("bk_access_token");

let currentUser =
JSON.parse(localStorage.getItem("bk_user") || "null");

let products = [];

let currentCategory = "Tout";


/* =========================
   OUTILS
========================= */

function formatPrice(price){

  return Number(price).toLocaleString("fr-FR")+" FCFA";

}


function message(text){

  document.getElementById("accountMessage").innerText = text;

}


function authHeaders(){

  return {
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+accessToken,
    "Content-Type":"application/json"
  };

}


/* =========================
   INSCRIPTION
========================= */

async function signUp(){

  const name =
    document.getElementById("nameInput").value.trim();

  const phone =
    document.getElementById("phoneInput").value.trim();

  const email =
    document.getElementById("emailInput").value.trim();

  const password =
    document.getElementById("passwordInput").value;

  if(!name || !phone || !email || !password){

    message("Remplis tous les champs.");

    return;
  }

  message("Création du compte...");

  try{

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/signup",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          email:email,

          password:password,

          data:{
            name:name,
            phone:phone
          }

        })
      }
    );

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        data.msg ||
        data.message ||
        data.error_description ||
        "Impossible de créer le compte."
      );

    }

    if(data.session){

      accessToken =
        data.session.access_token;

      currentUser =
        data.user;

      localStorage.setItem(
        "bk_access_token",
        accessToken
      );

      localStorage.setItem(
        "bk_user",
        JSON.stringify(currentUser)
      );

      await saveProfile(name,phone);

      showLoggedIn();

      await loadProducts();

      await loadOrders();

      await updateDashboard();

      message("Compte créé avec succès !");

    }else{

      message(
        "Compte créé. Vérifie ton email puis connecte-toi."
      );

    }

  }catch(error){

    console.error(error);

    message("ERREUR : "+error.message);

  }

}


/* =========================
   CONNEXION
========================= */

async function signIn(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    message("Entre ton email et ton mot de passe.");

    return;
  }

  message("Connexion...");

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        data.error_description ||
        data.msg ||
        "Email ou mot de passe incorrect."
      );

    }

    accessToken =
      data.access_token;

    currentUser =
      data.user;

    localStorage.setItem(
      "bk_access_token",
      accessToken
    );

    localStorage.setItem(
      "bk_user",
      JSON.stringify(currentUser)
    );

    showLoggedIn();

    await loadProfile();

    await loadProducts();

    await loadOrders();

    await updateDashboard();

    message("Connexion réussie !");

  }catch(error){

    console.error(error);

    message("ERREUR : "+error.message);

  }

}


/* =========================
   PROFIL
========================= */

async function saveProfile(name,phone){

  if(!accessToken || !currentUser){

    return;
  }

  try{

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/profiles",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+accessToken,
          "Content-Type":"application/json",
          "Prefer":"resolution=merge-duplicates"
        },

        body:JSON.stringify({

          id:currentUser.id,

          name:name,

          phone:phone,

          role:"vendeur",

          points:0

        })
      }
    );

    if(!response.ok){

      console.error(
        "Profil non enregistré :",
        await response.text()
      );

    }

  }catch(error){

    console.error(error);

  }

}


async function loadProfile(){

  if(!accessToken || !currentUser){

    return;
  }

  try{

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/profiles?id=eq."+
      currentUser.id+
      "&select=*",

      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+accessToken
        }
      }

    );

    if(!response.ok){

      return;
    }

    const profiles =
      await response.json();

    if(profiles.length > 0){

      const profile =
        profiles[0];

      const points =
        Number(profile.points) || 0;

      document.getElementById("userInfo").innerHTML =

        "<strong>"+
        (profile.name || "Vendeur")+
        "</strong><br>"+

        "WhatsApp : "+
        (profile.phone || "Non renseigné")+
        "<br>"+

        "Points : "+
        points;

      document.getElementById(
        "dashboardPoints"
      ).innerText = points;

    }

  }catch(error){

    console.error(error);

  }

}


function showLoggedIn(){

  document.getElementById(
    "loggedOut"
  ).style.display="none";

  document.getElementById(
    "loggedIn"
  ).style.display="block";

  document.getElementById(
    "dashboard"
  ).style.display="block";

  if(currentUser){

    document.getElementById(
      "userInfo"
    ).innerHTML =

      "<strong>Compte connecté</strong><br>"+
      currentUser.email;

  }

}


function showLoggedOut(){

  document.getElementById(
    "loggedOut"
  ).style.display="block";

  document.getElementById(
    "loggedIn"
  ).style.display="none";

  document.getElementById(
    "dashboard"
  ).style.display="none";

}


function signOut(){

  localStorage.removeItem(
    "bk_access_token"
  );

  localStorage.removeItem(
    "bk_user"
  );

  accessToken=null;

  currentUser=null;

  showLoggedOut();

  document.getElementById(
    "ordersList"
  ).innerHTML =
    "Connecte-toi pour voir tes commandes.";

  message("Déconnexion réussie.");

}


/* =========================
   PRODUITS SUPABASE
========================= */

async function loadProducts(){

  try{

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/products?select=*&order=id.asc",

      {
        headers:{
          "apikey":SUPABASE_KEY,
          ...(accessToken
            ? {"Authorization":"Bearer "+accessToken}
            : {})
        }
      }

    );

    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }

    products =
      await response.json();

    displayProducts(
      getFilteredProducts()
    );

  }catch(error){

    console.error(error);

    document.getElementById(
      "products"
    ).innerHTML =

      "<p style='padding:15px'>"+
      "Impossible de charger les produits."+
      "</p>";

  }

}


function getFilteredProducts(){

  let result =
    products;

  if(currentCategory !== "Tout"){

    result =
      result.filter(product =>
        product.category === currentCategory
      );

  }

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if(search){

    result =
      result.filter(product =>
        String(product.name || "")
          .toLowerCase()
          .includes(search)
      );

  }

  return result;

}


function displayProducts(list){

  const container =
    document.getElementById("products");

  container.innerHTML="";

  if(list.length===0){

    container.innerHTML =
      "<p style='padding:10px'>"+
      "Aucun article trouvé."+
      "</p>";

    return;

  }

  list.forEach(product=>{

    const stock =
      Number(product.stock) || 0;

    const price =
      Number(product.price) || 0;

    const points =
      Number(product.points) || 0;

    const disabled =
      stock <= 0 ? "disabled" : "";

    const buttonText =
      stock <= 0
      ? "Rupture de stock"
      : "Commander";

    container.innerHTML += `

      <div class="product">

        <h3>
          ${escapeHtml(product.name || "Produit")}
        </h3>

        <div class="price">
          ${formatPrice(price)}
        </div>

        <div class="stock">
          Stock : ${stock}
        </div>

        <div class="points">
          +${points} point${points > 1 ? "s" : ""}
        </div>

        <button
          ${disabled}
          onclick="orderProduct(
            ${Number(product.id)},
            '${escapeJs(product.name || "Produit")}'
          )">

          ${buttonText}

        </button>

      </div>

    `;

  });

}


function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(text){

  return String(text)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}


/* =========================
   FILTRES
========================= */

function filterProducts(category,button){

  currentCategory =
    category;

  document
    .querySelectorAll(".categories button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  displayProducts(
    getFilteredProducts()
  );

}


function searchProducts(){

  displayProducts(
    getFilteredProducts()
  );

}


/* =========================
   COMMANDER
========================= */

async function orderProduct(productId,name){

  if(!accessToken || !currentUser){

    alert(
      "Connecte-toi ou crée ton compte vendeur avant de commander."
    );

    return;

  }

  const product =
    products.find(
      p => Number(p.id) === Number(productId)
    );

  if(!product){

    alert("Produit introuvable.");

    return;

  }

  const stock =
    Number(product.stock) || 0;

  const price =
    Number(product.price) || 0;

  const points =
    Number(product.points) || 0;

  if(stock <= 0){

    alert("Ce produit est en rupture de stock.");

    return;

  }

  const buttons =
    document.querySelectorAll(
      ".product button"
    );

  buttons.forEach(button=>{
    button.disabled=true;
  });

  try{

    /*
      On utilise un identifiant numérique
      comme dans ta table orders.
    */

    const orderId =
      Date.now();

    /* =========================
       1. CREER LA COMMANDE
    ========================= */

    const orderResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/order,
        {
          method:"POST",

          headers:{
            ...authHeaders(),
            "Prefer":"return=minimal"
          },

          body:JSON.stringify({

            id:orderId,

            user_id:currentUser.id,

            total:price,

            status:"pending"

          })
        }
      );

    if(!orderResponse.ok){

      throw new Error(
        "Commande : "+
        await orderResponse.text()
      );

    }


    /* =========================
       2. AJOUTER LE PRODUIT
       DANS ORDER ITEMS
    ========================= */

    const itemResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/order_items",
        {
          method:"POST",

          headers:{
            ...authHeaders(),
            "Prefer":"return=minimal"
          },

          body:JSON.stringify({

            order_id:orderId,

            product_id:Number(product.id),

            quantity:1,

            price:price,

            product_name:name

          })
        }
      );

    if(!itemResponse.ok){

      throw new Error(
        "Article de commande : "+
        await itemResponse.text()
      );

    }


    /* =========================
       3. DIMINUER LE STOCK
    ========================= */

    const newStock =
      stock - 1;

    const stockResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/products?id=eq."+
        product.id,

        {
          method:"PATCH",

          headers:{
            ...authHeaders(),
            "Prefer":"return=minimal"
          },

          body:JSON.stringify({

            stock:newStock

          })
        }

      );

    if(!stockResponse.ok){
