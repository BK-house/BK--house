<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BK House</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#222;
}

header{
  background:#1769aa;
  color:white;
  padding:20px;
  text-align:center;
}

.logo{
  font-size:32px;
  font-weight:bold;
}

.brand{
  font-size:22px;
  font-weight:bold;
  margin-top:4px;
}

.slogan{
  font-size:14px;
  margin-top:5px;
}

.search{
  padding:15px;
  background:white;
}

.search input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

.categories{
  display:flex;
  gap:8px;
  padding:12px;
  overflow-x:auto;
  background:white;
}

.categories button{
  border:0;
  background:#e9eef3;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
}

.categories button.active{
  background:#1769aa;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:15px;
}

.product{
  background:white;
  border-radius:10px;
  padding:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product h3{
  margin:0 0 8px;
  font-size:16px;
}

.price{
  color:#1769aa;
  font-weight:bold;
  margin-bottom:6px;
}

.stock{
  font-size:13px;
  color:#666;
  margin-bottom:10px;
}

.product button{
  width:100%;
  border:0;
  background:#1769aa;
  color:white;
  padding:10px;
  border-radius:7px;
  cursor:pointer;
}

.product button:disabled{
  background:#999;
  cursor:not-allowed;
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:13px;
}

@media(max-width:500px){
  .products{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">BK</div>
  <div class="brand">BK House</div>
  <div class="slogan">La signature du bon goût</div>
</header>

<div class="search">
  <input
    type="text"
    id="searchInput"
    placeholder="Rechercher un article..."
    oninput="searchProducts()"
  >
</div>

<div class="categories">
  <button class="active" onclick="filterProducts('Tout',this)">Tout</button>
  <button onclick="filterProducts('Homme',this)">Homme</button>
  <button onclick="filterProducts('Femme',this)">Femme</button>
  <button onclick="filterProducts('Accessoires',this)">Accessoires</button>
</div>

<div class="products" id="products"></div>

<footer>
  © 2026 BK House
</footer>

<script>
const SUPABASE_URL = "https://guutggkqdmolyklhdfrw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rpU7ZA6E0q2d7nzp97K6yg_FpoFjRNi";

const products = [
  {
    name:"T-shirt oversize",
    price:3500,
    stock:50,
    category:"Homme"
  },
  {
    name:"Top femme",
    price:3000,
    stock:30,
    category:"Femme"
  },
  {
    name:"Jean homme",
    price:4500,
    stock:25,
    category:"Homme"
  },
  {
    name:"Jupe bohème",
    price:3500,
    stock:20,
    category:"Femme"
  },
  {
    name:"Sac tendance",
    price:5000,
    stock:15,
    category:"Accessoires"
  }
];

let currentCategory="Tout";

function formatPrice(price){
  return price.toLocaleString("fr-FR")+" FCFA";
}

function displayProducts(list){
  const container=document.getElementById("products");

  container.innerHTML="";

  list.forEach((product,index)=>{
    container.innerHTML += `
      <div class="product">
        <h3>${product.name}</h3>
        <div class="price">${formatPrice(product.price)}</div>
        <div class="stock">Stock : ${product.stock}</div>
        <button
          id="order-${index}"
          onclick="orderProduct('${product.name.replace(/'/g,"\\'")}',${product.price})">
          Commander
        </button>
      </div>
    `;
  });
}

function filterProducts(category,button){
  currentCategory=category;

  document.querySelectorAll(".categories button")
    .forEach(btn=>btn.classList.remove("active"));

  button.classList.add("active");

  const filtered =
    category==="Tout"
    ? products
    : products.filter(product=>product.category===category);

  displayProducts(filtered);
}

function searchProducts(){
  const search=
    document.getElementById("searchInput")
    .value
    .toLowerCase();

  let filtered=products.filter(product =>
    product.name.toLowerCase().includes(search)
  );

  if(currentCategory!=="Tout"){
    filtered=filtered.filter(product =>
      product.category===currentCategory
    );
  }

  displayProducts(filtered);
}
async function orderProduct(name,price){

  const buttons=document.querySelectorAll(".product button");

  buttons.forEach(button=>{
    button.disabled=true;
  });

  try{

    const orderResponse = await fetch(
      SUPABASE_URL + "/rest/v1/orders",
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=representation"
        },
        body:JSON.stringify({
          total:price,
          status:"pending"
        })
      }
    );

    if(!orderResponse.ok){
      throw new Error(await orderResponse.text());
    }

    const orderData=await orderResponse.json();
    const orderId=orderData[0].id;

    const itemResponse = await fetch(
      SUPABASE_URL + "/rest/v1/order_items",
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          order_id:orderId,
          product_id:null,
          quantity:1,
          price:price,
          product_name:name
        })
      }
    );

    if(!itemResponse.ok){
      throw new Error(await itemResponse.text());
    }

    alert(
      "Commande "+name+
      " enregistrée avec succès dans BK House."
    );

  }catch(error){

    console.error(error);

    alert(
      "La commande n'a pas pu être enregistrée. "+
      "Vérifie la connexion à Supabase."
    );

  }finally{

    buttons.forEach(button=>{
      button.disabled=false;
    });
    
  }
}

displayProducts(products);
</script>

</body>
</html>
