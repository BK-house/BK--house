<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BK House</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#222;
}

header{
  background:#1769aa;
  color:white;
  padding:20px;
  text-align:center;
}

.logo{
  font-size:32px;
  font-weight:bold;
}

.brand{
  font-size:22px;
  font-weight:bold;
  margin-top:4px;
}

.slogan{
  font-size:14px;
  margin-top:5px;
}

.account{
  background:white;
  margin:15px;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.account h2{
  margin-top:0;
  color:#1769aa;
}

.account input{
  width:100%;
  padding:11px;
  margin-bottom:8px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:15px;
}

.account button{
  width:100%;
  padding:11px;
  border:0;
  border-radius:7px;
  background:#1769aa;
  color:white;
  font-size:15px;
  margin-top:5px;
}

.logout{
  background:#777 !important;
}

#accountMessage{
  margin-top:10px;
  font-size:14px;
}

.search{
  padding:15px;
  background:white;
}

.search input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

.categories{
  display:flex;
  gap:8px;
  padding:12px;
  overflow-x:auto;
  background:white;
}

.categories button{
  border:0;
  background:#e9eef3;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
}

.categories button.active{
  background:#1769aa;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:15px;
}

.product{
  background:white;
  border-radius:10px;
  padding:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product h3{
  margin:0 0 8px;
  font-size:16px;
}

.price{
  color:#1769aa;
  font-weight:bold;
  margin-bottom:6px;
}

.stock{
  font-size:13px;
  color:#666;
  margin-bottom:10px;
}

.product button{
  width:100%;
  border:0;
  background:#1769aa;
  color:white;
  padding:10px;
  border-radius:7px;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:13px;
}

@media(max-width:500px){
  .products{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">BK</div>
  <div class="brand">BK House</div>
  <div class="slogan">La signature du bon goût</div>
</header>

<!-- COMPTE VENDEUR -->
<div class="account">

  <div id="loggedOut">

    <h2>Créer mon compte vendeur</h2>

    <input
      type="text"
      id="nameInput"
      placeholder="Nom et prénom"
    >

    <input
      type="text"
      id="phoneInput"
      placeholder="Numéro WhatsApp"
    >

    <input
      type="email"
      id="emailInput"
      placeholder="Adresse email"
    >

    <input
      type="password"
      id="passwordInput"
      placeholder="Mot de passe"
    >

    <button onclick="signUp()">
      Créer mon compte
    </button>

    <hr style="margin:18px 0">

    <h2>Déjà un compte ?</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Adresse email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Mot de passe"
    >

    <button onclick="signIn()">
      Se connecter
    </button>

  </div>

  <div id="loggedIn" style="display:none">

    <h2>Mon compte</h2>

    <div id="userInfo"></div>

    <button class="logout" onclick="signOut()">
      Se déconnecter
    </button>

  </div>

  <div id="accountMessage"></div>

</div>

<div class="search">
  <input
    type="text"
    id="searchInput"
    placeholder="Rechercher un article..."
    oninput="searchProducts()"
  >
</div>

<div class="categories">
  <button class="active" onclick="filterProducts('Tout',this)">Tout</button>
  <button onclick="filterProducts('Homme',this)">Homme</button>
  <button onclick="filterProducts('Femme',this)">Femme</button>
  <button onclick="filterProducts('Accessoires',this)">Accessoires</button>
</div>

<div class="products" id="products"></div>

<div id="ordersSection"
     style="padding:15px;background:white;margin-top:15px;">

  <h2>Mes commandes</h2>

  <div id="ordersList">
    Connecte-toi pour voir tes commandes.
  </div>

</div>

<footer>
  © 2026 BK House
</footer>

<script>

const SUPABASE_URL =
"https://guutggkqdmolyklhdfrw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rpU7ZA6E0q2d7nzp97K6yg_FpoFjRNi";

let accessToken =
localStorage.getItem("bk_access_token");

let currentUser =
JSON.parse(localStorage.getItem("bk_user") || "null");

const products = [

  {
    name:"T-shirt oversize",
    price:3500,
    stock:50,
    category:"Homme"
  },

  {
    name:"Top femme",
    price:3000,
    stock:30,
    category:"Femme"
  },

  {
    name:"Jean homme",
    price:4500,
    stock:25,
    category:"Homme"
  },

  {
    name:"Jupe bohème",
    price:3500,
    stock:20,
    category:"Femme"
  },

  {
    name:"Sac tendance",
    price:5000,
    stock:15,
    category:"Accessoires"
  }

];

let currentCategory="Tout";


function formatPrice(price){

  return price.toLocaleString("fr-FR")+" FCFA";

}


function message(text){

  document.getElementById("accountMessage").innerText=text;

}


async function signUp(){

  const name =
    document.getElementById("nameInput").value.trim();

  const phone =
    document.getElementById("phoneInput").value.trim();

  const email =
    document.getElementById("emailInput").value.trim();

  const password =
    document.getElementById("passwordInput").value;

  if(!name || !phone || !email || !password){

    message("Remplis tous les champs.");

    return;
  }

  message("Création du compte...");

  try{

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/signup",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          email:email,
          password:password,

          data:{
            name:name,
            phone:phone
          }
        })
      }
    );

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        data.msg ||
        data.message ||
        data.error_description ||
        "Impossible de créer le compte."
      );

    }

    if(data.session){

      accessToken=data.session.access_token;

      currentUser=data.user;

      localStorage.setItem(
        "bk_access_token",
        accessToken
      );

      localStorage.setItem(
        "bk_user",
        JSON.stringify(currentUser)
      );

      await saveProfile(name,phone);

      showLoggedIn();

      message("Compte créé avec succès !");

    }else{

      message(
        "Compte créé. Vérifie ton email puis connecte-toi."
      );

    }

  }catch(error){

    console.error(error);

    message("ERREUR : "+error.message);

  }

}


async function signIn(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    message("Entre ton email et ton mot de passe.");

    return;
  }

  message("Connexion...");

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        data.error_description ||
        data.msg ||
        "Email ou mot de passe incorrect."
      );

    }

    accessToken=data.access_token;

    currentUser=data.user;

    localStorage.setItem(
      "bk_access_token",
      accessToken
    );

    localStorage.setItem(
      "bk_user",
      JSON.stringify(currentUser)
    );

    showLoggedIn();

    await loadProfile();

    await loadOrders();

    message("Connexion réussie !");

  }catch(error){

    console.error(error);

    message("ERREUR : "+error.message);

  }

}


async function saveProfile(name,phone){

  if(!accessToken || !currentUser){

    return;
  }

  try{

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/profiles",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+accessToken,
          "Content-Type":"application/json",
          "Prefer":"resolution=merge-duplicates"
        },

        body:JSON.stringify({
          id:currentUser.id,
          name:name,
          phone:phone,
          role:"vendeur",
          points:0
        })
      }
    );

    if(!response.ok){

      console.error(
        "Profil non enregistré :",
        await response.text()
      );

    }

  }catch(error){

    console.error(error);

  }

}


async function loadProfile(){

  if(!accessToken || !currentUser){

    return;
  }

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/profiles?id=eq." +
      currentUser.id +
      "&select=*",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+accessToken
        }
      }
    );

    if(!response.ok){

      return;
    }

    const profiles = await response.json();

    if(profiles.length > 0){

      const profile=profiles[0];

      document.getElementById("userInfo").innerHTML=
        "<strong>"+(profile.name || "Vendeur")+"</strong><br>"+
        "WhatsApp : "+(profile.phone || "Non renseigné")+"<br>"+
        "Points : "+(profile.points || 0);

    }

  }catch(error){

    console.error(error);

  }

}


function showLoggedIn(){

  document.getElementById("loggedOut").style.display="none";

  document.getElementById("loggedIn").style.display="block";

  if(currentUser){

    document.getElementById("userInfo").innerHTML=
      "<strong>Compte connecté</strong><br>"+
      currentUser.email;
  }

}


function showLoggedOut(){

  document.getElementById("loggedOut").style.display="block";

  document.getElementById("loggedIn").style.display="none";

}


function signOut(){

  localStorage.removeItem("bk_access_token");

  localStorage.removeItem("bk_user");

  accessToken=null;

  currentUser=null;

  showLoggedOut();

  document.getElementById("ordersList").innerHTML=
    "Connecte-toi pour voir tes commandes.";

  message("Déconnexion réussie.");

}


function displayProducts(list){

  const container=document.getElementById("products");

  container.innerHTML="";

  list.forEach((product,index)=>{

    container.innerHTML += `

      <div class="product">

        <h3>${product.name}</h3>

        <div class="price">
          ${formatPrice(product.price)}
        </div>

        <div class="stock">
          Stock : ${product.stock}
        </div>

        <button
          onclick="orderProduct('${product.name.replace(/'/g,"\\'")}',${product.price})">

          Commander

        </button>

      </div>

    `;

  });

}


function filterProducts(category,button){

  currentCategory=category;

  document
    .querySelectorAll(".categories button")
    .forEach(btn=>btn.classList.remove("active"));

  button.classList.add("active");

  const filtered =
    category==="Tout"
    ? products
    : products.filter(
        product=>product.category===category
      );

  displayProducts(filtered);

}


function searchProducts(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();

  let filtered =
    products.filter(product =>
      product.name.toLowerCase().includes(search)
    );

  if(currentCategory!=="Tout"){

    filtered=filtered.filter(product =>
      product.category===currentCategory
    );

  }

  displayProducts(filtered);

}


async function orderProduct(name,price){

  if(!accessToken || !currentUser){

    alert(
      "Connecte-toi ou crée ton compte vendeur avant de commander."
    );

    return;

  }

  const buttons =
    document.querySelectorAll(".product button");

  buttons.forEach(button=>{
    button.disabled=true;
  });

  try{

    const orderId=Date.now();

    const orderResponse = await fetch(
      SUPABASE_URL + "/rest/v1/orders",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+accessToken,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },

        body:JSON.stringify({

          id:orderId,

          user_id:currentUser.id,

          total:price,

          status:"pending"

        })
      }
    );

    if(!orderResponse.ok){

      throw new Error(
        await orderResponse.text()
      );

    }

    const itemResponse = await fetch(
      SUPABASE_URL + "/rest/v1/order_items",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+accessToken,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },

        body:JSON.stringify({

          order_id:orderId,

          product_id:null,

          quantity:1,

          price:price,

          product_name:name

        })
      }
    );

    if(!itemResponse.ok){

      throw new Error(
        await itemResponse.text()
      );

    }

    alert(
      "Commande "+name+
      " enregistrée avec succès dans BK House."
    );

    await loadOrders();

  }catch(error){

    console.error(error);

    alert("ERREUR : "+error.message);

  }finally{

    buttons.forEach(button=>{
      button.disabled=false;
    });

  }

}


async function loadOrders(){

  const ordersList =
    document.getElementById("ordersList");

  if(!accessToken || !currentUser){

    ordersList.innerHTML=
      "Connecte-toi pour voir tes commandes.";

    return;

  }

  try{

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/orders?user_id=eq."+
      currentUser.id+
      "&select=*&order=id.desc",

      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+accessToken
        }
      }

    );

    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }

    const orders=await response.json();

    if(orders.length===0){

      ordersList.innerHTML=
        "Aucune commande pour le moment.";

      return;

    }

    const itemsResponse = await fetch(

      SUPABASE_URL +
      "/rest/v1/order_items?select=*",

      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+accessToken
        }
      }

    );

    if(!itemsResponse.ok){

      throw new Error(
        await itemsResponse.text()
      );

    }

    const items=await itemsResponse.json();

    ordersList.innerHTML = orders.map(order=>{

      const item=items.find(
        item =>
          Number(item.order_id) === Number(order.id)
      );

      return `

        <div style="
          border:1px solid #ddd;
          border-radius:8px;
          padding:12px;
          margin-bottom:10px;
        ">

          <strong>
            Commande #${order.id}
          </strong><br>

          Produit :
          ${item ? item.product_name : "Produit"}
          <br>

          Quantité :
          ${item ? item.quantity : 1}
          <br>

          Montant :
          ${formatPrice(Number(order.total)||0)}
          <br>

          Statut :
          ${order.status || "pending"}

        </div>

      `;

    }).join("");

  }catch(error){

    console.error(error);

    ordersList.innerHTML=
      "Impossible de charger les commandes.";

  }

}


/* DÉMARRAGE */

displayProducts(products);

if(accessToken && currentUser){

  showLoggedIn();

  loadProfile();

  loadOrders();

}else{

  showLoggedOut();

}

</script>

</body>
</html>
