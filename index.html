<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BK House</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#222;
}

header{
  background:#1769aa;
  color:white;
  padding:20px;
  text-align:center;
}

.logo{font-size:32px;font-weight:bold}
.brand{font-size:22px;font-weight:bold;margin-top:4px}
.slogan{font-size:14px;margin-top:5px}

.account,.dashboard{
  background:white;
  margin:15px;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.account h2,.dashboard h2{
  margin-top:0;
  color:#1769aa;
}

.account input{
  width:100%;
  padding:11px;
  margin-bottom:8px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:15px;
}

.account button{
  width:100%;
  padding:11px;
  border:0;
  border-radius:7px;
  background:#1769aa;
  color:white;
  font-size:15px;
  margin-top:5px;
  cursor:pointer;
}

.logout{
  background:#777 !important;
}

#accountMessage{
  margin-top:10px;
  font-size:14px;
}

.goalBox{
  background:#eef6fc;
  border-radius:10px;
  padding:15px;
  margin-top:10px;
}

.goalNumber{
  font-size:28px;
  font-weight:bold;
  color:#1769aa;
}

.goalMessage{
  margin-top:5px;
  font-size:14px;
}

.search{
  padding:15px;
  background:white;
}

.search input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

.categories{
  display:flex;
  gap:8px;
  padding:12px;
  overflow-x:auto;
  background:white;
}

.categories button{
  border:0;
  background:#e9eef3;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.categories button.active{
  background:#1769aa;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:15px;
}

.product{
  background:white;
  border-radius:10px;
  padding:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product h3{
  margin:0 0 8px;
  font-size:16px;
}

.price{
  color:#1769aa;
  font-weight:bold;
  margin-bottom:6px;
}

.stock{
  font-size:13px;
  color:#666;
  margin-bottom:5px;
}

.points{
  font-size:13px;
  color:#1769aa;
  margin-bottom:10px;
  font-weight:bold;
}

.product button{
  width:100%;
  border:0;
  background:#1769aa;
  color:white;
  padding:10px;
  border-radius:7px;
  cursor:pointer;
}

.product button:disabled{
  background:#aaa;
  cursor:not-allowed;
}

#ordersSection{
  padding:15px;
  background:white;
  margin-top:15px;
}

.orderCard{
  border:1px solid #ddd;
  border-radius:8px;
  padding:12px;
  margin-bottom:10px;
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:13px;
}

@media(max-width:500px){
  .products{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">BK</div>
  <div class="brand">BK House</div>
  <div class="slogan">La signature du bon goût</div>
</header>

<div class="account">

  <div id="loggedOut">

    <h2>Créer mon compte vendeur</h2>

    <input
      type="text"
      id="nameInput"
      placeholder="Nom et prénom"
    >

    <input
      type="text"
      id="phoneInput"
      placeholder="Numéro WhatsApp"
    >

    <input
      type="email"
      id="emailInput"
      placeholder="Adresse email"
    >

    <input
      type="password"
      id="passwordInput"
      placeholder="Mot de passe"
    >

    <button onclick="signUp()">
      Créer mon compte
    </button>

    <hr style="margin:18px 0">

    <h2>Déjà un compte ?</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Adresse email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Mot de passe"
    >

    <button onclick="signIn()">
      Se connecter
    </button>

  </div>

<div id="loggedIn" style="display:none">  

<div id="ordersSection">

  <h2>Mes commandes</h2><div id="ordersList">
  Connecte-toi pour voir tes commandes.
  </div>

    <h2>Mon compte</h2>

    <div id="userInfo"></div>

    <button class="logout" onclick="signOut()">
      Se déconnecter
    </button>

  </div>

  <div id="accountMessage"></div>

</div>

<div
  class="dashboard"
  id="dashboard"
  style="display:none"
>

  <h2>Mon objectif</h2>

  <div class="goalBox">

    <div>Ventes aujourd'hui</div>

    <div
      class="goalNumber"
      id="todaySales"
    >
      0 / 3
    </div>

    <div
      class="goalMessage"
      id="goalMessage"
    >
      Encore 3 ventes pour atteindre ton objectif.
    </div>

    <div style="margin-top:12px">
      Points :
      <strong id="dashboardPoints">0</strong>
    </div>

  </div>

</div>

<div class="search">

  <input
    type="text"
    id="searchInput"
    placeholder="Rechercher un article..."
    oninput="searchProducts()"
  >

</div>

<div class="categories">

  <button
    class="active"
    onclick="filterProducts('Tout',this)"
  >
    Tout
  </button>

  <button
    onclick="filterProducts('Homme',this)"
  >
    Homme
  </button>

  <button
    onclick="filterProducts('Femme',this)"
  >
    Femme
  </button>

  <button
    onclick="filterProducts('Accessoires',this)"
  >
    Accessoires
  </button>

</div>

<div
  class="products"
  id="products"
>
  <p style="padding:15px">
    Chargement des produits...
  </p>

</div>

<footer>
  © 2026 BK House
</footer>

<script>

const SUPABASE_URL =
"https://guutggkqdmolyklhdfrw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rpU7ZA6E0q2d7nzp97K6yg_FpoFjRNi";

let accessToken =
localStorage.getItem("bk_access_token");

let currentUser =
JSON.parse(
  localStorage.getItem("bk_user") || "null"
);

let products = [];

let currentCategory = "Tout";

const DAILY_GOAL = 3;


/* =========================
   OUTILS
========================= */

function formatPrice(price){

  return Number(price)
    .toLocaleString("fr-FR")
    +" FCFA";

}


function message(text){

  const box =
    document.getElementById("accountMessage");

  if(box){
    box.innerText = text;
  }

}


function authHeaders(){

  return {

    "apikey":SUPABASE_KEY,

    "Authorization":
      "Bearer "+accessToken,

    "Content-Type":
      "application/json"

  };

}


function escapeHtml(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   INSCRIPTION
========================= */

async function signUp(){

  const name =
    document
      .getElementById("nameInput")
      .value
      .trim();

  const phone =
    document
      .getElementById("phoneInput")
      .value
      .trim();

  const email =
    document
      .getElementById("emailInput")
      .value
      .trim();

  const password =
    document
      .getElementById("passwordInput")
      .value;


  if(!name || !phone || !email || !password){

    message(
      "Remplis tous les champs."
    );

    return;

  }


  if(password.length < 6){

    message(
      "Le mot de passe doit contenir au moins 6 caractères."
    );

    return;

  }


  message(
    "Création du compte..."
  );


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/signup",
        {
          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            email:email,
            password:password,

            data:{
              name:name,
              phone:phone
            }
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.msg ||
        data.message ||
        data.error_description ||
        "Impossible de créer le compte."
      );

    }


    if(data.session){

      accessToken =
        data.session.access_token;

      currentUser =
        data.user;


      localStorage.setItem(
        "bk_access_token",
        accessToken
      );


      localStorage.setItem(
        "bk_user",
        JSON.stringify(currentUser)
      );


      await saveProfile(
        name,
        phone
      );


      showLoggedIn();

      await loadProfile();

      await loadProducts();

      await loadOrders();

      await updateDashboard();


      message(
        "Compte créé avec succès !"
      );

    }else{

      message(
        "Compte créé. Vérifie ton email puis connecte-toi."
      );

    }

  }catch(error){

    console.error(error);

    message(
      "ERREUR : "+error.message
    );

  }

}


/* =========================
   CONNEXION
========================= */

async function signIn(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if(!email || !password){

    message(
      "Entre ton email et ton mot de passe."
    );

    return;

  }


  message("Connexion...");


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            email:email,
            password:password
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error_description ||
        data.msg ||
        "Email ou mot de passe incorrect."
      );

    }


    accessToken =
      data.access_token;

    currentUser =
      data.user;


    localStorage.setItem(
      "bk_access_token",
      accessToken
    );


    localStorage.setItem(
      "bk_user",
      JSON.stringify(currentUser)
    );


    showLoggedIn();

    await loadProfile();

    await loadProducts();

    await loadOrders();

    await updateDashboard();


    message(
      "Connexion réussie !"
    );


  }catch(error){

    console.error(error);

    message(
      "ERREUR : "+error.message
    );

  }

}


/* =========================
   PROFIL
========================= */

async function saveProfile(
  name,
  phone
){

  if(!accessToken || !currentUser){
    return;
  }


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/profiles",
        {
          method:"POST",

          headers:{
            ...authHeaders(),

            "Prefer":
              "resolution=merge-duplicates,return=minimal"
          },

          body:JSON.stringify({

            id:currentUser.id,

            name:name,

            phone:phone,

            role:"vendeur",

            points:0

          })
        }
      );


    if(!response.ok){

      console.error(
        "Profil non enregistré :",
        await response.text()
      );

    }

  }catch(error){

    console.error(error);

  }

}


async function loadProfile(){

  if(!accessToken || !currentUser){
    return;
  }


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/profiles?id=eq." +
        encodeURIComponent(
          currentUser.id
        ) +
        "&select=*",

        {
          headers:{
            "apikey":SUPABASE_KEY,

            "Authorization":
              "Bearer "+accessToken
          }
        }

      );


    if(!response.ok){
      return;
    }


    const profiles =
      await response.json();


    if(profiles.length > 0){

      const profile =
        profiles[0];


      const points =
        Number(profile.points) || 0;


      document.getElementById(
        "userInfo"
      ).innerHTML =

        "<strong>" +
        escapeHtml(
          profile.name ||
          "Vendeur"
        ) +
        "</strong><br>" +

        "WhatsApp : " +

        escapeHtml(
          profile.phone ||
          "Non renseigné"
        ) +

        "<br>" +

        "Points : " +

        points;


      document.getElementById(
        "dashboardPoints"
      ).innerText =
        points;

    }

  }catch(error){

    console.error(error);

  }

}


/* =========================
   AFFICHAGE COMPTE
========================= */

function showLoggedIn(){

  document.getElementById(
    "loggedOut"
  ).style.display = "none";


  document.getElementById(
    "loggedIn"
  ).style.display = "block";


  document.getElementById(
    "dashboard"
  ).style.display = "block";


  if(currentUser){

    document.getElementById(
      "userInfo"
    ).innerHTML =

      "<strong>Compte connecté</strong><br>" +

      escapeHtml(
        currentUser.email || ""
      );

  }

}


function showLoggedOut(){

  document.getElementById(
    "loggedOut"
  ).style.display = "block";


  document.getElementById(
    "loggedIn"
  ).style.display = "none";


  document.getElementById(
    "dashboard"
  ).style.display = "none";

}


function signOut(){

  localStorage.removeItem(
    "bk_access_token"
  );

  localStorage.removeItem(
    "bk_user"
  );


  accessToken = null;

  currentUser = null;


  showLoggedOut();


  document.getElementById(
    "ordersList"
  ).innerHTML =
    "Connecte-toi pour voir tes commandes.";


  document.getElementById(
    "todaySales"
  ).innerText =
    "0 / "+DAILY_GOAL;


  document.getElementById(
    "goalMessage"
  ).innerText =
    "Encore "+DAILY_GOAL+
    " ventes pour atteindre ton objectif.";


  message(
    "Déconnexion réussie."
  );

}


/* =========================
   PRODUITS
========================= */

async function loadProducts(){

  const container =
    document.getElementById(
      "products"
    );


  container.innerHTML =
    "<p style='padding:15px'>Chargement des produits...</p>";


  try{

    const headers = {
      "apikey":SUPABASE_KEY
    };


    if(accessToken){

      headers["Authorization"] =
        "Bearer "+accessToken;

    }


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/products?select=*&order=id.asc",

        {
          headers:headers
        }

      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const data =
      await response.json();


    products =
      Array.isArray(data)
      ? data
      : [];


    displayProducts(
      getFilteredProducts()
    );


  }catch(error){

    console.error(
      "Erreur produits :",
      error
    );


    container.innerHTML =
      "<p style='padding:15px'>" +
      "Impossible de charger les produits." +
      "</p>";

  }

}


function getFilteredProducts(){

  let result =
    [...products];


  if(currentCategory !== "Tout"){

    result =
      result.filter(
        product =>

          String(
            product.category || ""
          ).toLowerCase() ===

          currentCategory.toLowerCase()

      );

  }


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  if(search){

    result =
      result.filter(
        product =>

          String(
            product.name || ""
          )
          .toLowerCase()
          .includes(search)

      );

  }


  return result;

}


function displayProducts(list){

  const container =
    document.getElementById(
      "products"
    );


  container.innerHTML = "";


  if(!list.length){

    container.innerHTML =
      "<p style='padding:10px'>" +
      "Aucun article trouvé." +
      "</p>";

    return;

  }


  list.forEach(
    product => {

      const stock =
        Number(product.stock) || 0;


      const price =
        Number(product.price) || 0;


      const points =
        Number(product.points) || 0;


      const disabled =
        stock <= 0
        ? "disabled"
        : "";


      const buttonText =
        stock <= 0
        ? "Rupture de stock"
        : "Commander";


      container.innerHTML += `

        <div class="product">

          <h3>
            ${escapeHtml(
              product.name ||
              "Produit"
            )}
          </h3>

          <div class="price">
            ${formatPrice(price)}
          </div>

          <div class="stock">
            Stock : ${stock}
          </div>

          <div class="points">
            +${points}
            point${points > 1 ? "s" : ""}
          </div>

          <button
            data-product-id="${Number(product.id)}"
            ${disabled}
            onclick="orderProduct(${Number(product.id)})"
          >
            ${buttonText}
          </button>

        </div>

      `;

    }
  );

}


/* =========================
   FILTRES
========================= */

function filterProducts(
  category,
  button
){

  currentCategory =
    category;


  document
    .querySelectorAll(
      ".categories button"
    )
    .forEach(
      btn =>
        btn.classList.remove(
          "active"
        )
    );


  button.classList.add(
    "active"
  );


  displayProducts(
    getFilteredProducts()
  );

}


function searchProducts(){

  displayProducts(
    getFilteredProducts()
  );

}


/* =========================
   COMMANDER
========================= */

async function orderProduct(
  productId
){

  if(
    !accessToken ||
    !currentUser
  ){

    alert(
      "Connecte-toi ou crée ton compte vendeur avant de commander."
    );

    return;

  }


  const product =
    products.find(
      p =>
        Number(p.id) ===
        Number(productId)
    );


  if(!product){

    alert(
      "Produit introuvable."
    );

    return;

  }


  const stock =
    Number(product.stock) || 0;


  const price =
    Number(product.price) || 0;


  const points =
    Number(product.points) || 0;


  if(stock <= 0){

    alert(
      "Ce produit est en rupture de stock."
    );

    return;

  }


  document
    .querySelectorAll(
      ".product button"
    )
    .forEach(
      button =>
        button.disabled = true
    );


  try{

    const orderId =
      Date.now();


    /* 1. CREER LA COMMANDE */

    const orderResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/orders",

        {
          method:"POST",

          headers:{
            ...authHeaders(),

            "Prefer":
              "return=minimal"
          },

          body:JSON.stringify({

            id:orderId,

            user_id:
              currentUser.id,

            total:
              price,

            status:
              "pending"

          })
        }

      );


    if(!orderResponse.ok){

      throw new Error(
        "Commande : " +
        await orderResponse.text()
      );

    }


    /* 2. AJOUTER L'ARTICLE */

    const itemResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/order_items",

        {
          method:"POST",

          headers:{
            ...authHeaders(),

            "Prefer":
              "return=minimal"
          },

          body:JSON.stringify({

            order_id:
              orderId,

            product_id:
              Number(product.id),

            quantity:
              1,

                        price:
              price,

            product_name:
              product.name

          })

        );



    if(!itemResponse.ok){

      throw new Error(
        "Article de commande : " +
        await itemResponse.text()
      );

    }


    /* 3. DIMINUER LE STOCK */

    const newStock =
      Math.max(
        0,
        stock - 1
      );


    const stockResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        encodeURIComponent(
          product.id
        ),

        {
          method:"PATCH",

          headers:{
            ...authHeaders(),

            "Prefer":
              "return=minimal"
          },

          body:JSON.stringify({

            stock:
              newStock

          })
        }

      );


  if(!stockResponse.ok){

  throw new Error(
    "Stock : " +
    await stockResponse.text()
  );

}


/* 4. METTRE À JOUR LES POINTS */

try {

  const profileResponse =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/profiles?id=eq." +
      encodeURIComponent(currentUser.id) +
      "&select=points",
      {
        headers: {
          ...authHeaders()
        }
      }
    );

  if(profileResponse.ok){

    const profileData =
      await profileResponse.json();

    const currentPoints =
      profileData.length > 0
        ? Number(profileData[0].points) || 0
        : 0;

    const newPoints =
      currentPoints + points;

    const pointsResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/profiles?id=eq." +
        encodeURIComponent(currentUser.id),
        {
          method:"PATCH",

          headers:{
            ...authHeaders(),

            "Prefer":
              "return=minimal"
          },

          body:JSON.stringify({
            points:newPoints
          })
        }
      );

    if(!pointsResponse.ok){

      console.error(
        "Points non mis à jour :",
        await pointsResponse.text()
      );

    }

  }

}catch(error){

  console.error(
    "Erreur mise à jour des points :",
    error
  );

}


/* 5. RECHARGER LES DONNÉES */

await loadProducts();

await loadOrders();

await updateDashboard();

alert(
  "Commande enregistrée avec succès !"
);
      }catch(error){

    console.error(
      "Erreur commande :",
      error
    );

    alert(
      "Impossible d'enregistrer la commande : " +
      error.message
    );

  }finally{

    document
      .querySelectorAll(
        ".product button"
      )
      .forEach(
        button => {

          const productId =
            Number(
              button.dataset.productId
            );

          const product =
            products.find(
              p =>
                Number(p.id) ===
                productId
            );

          button.disabled =
            !product ||
            Number(product.stock) <= 0;

        }
      );

  }

}/* =========================
   COMMANDES
========================= */

async function loadOrders(){

  const container =
    document.getElementById("ordersList");

  if(!container){
    return;
  }

  if(!accessToken || !currentUser){

    container.innerHTML =
      "Connecte-toi pour voir tes commandes.";

    return;
  }

  container.innerHTML =
    "Chargement de tes commandes...";

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/orders?user_id=eq." +
        encodeURIComponent(currentUser.id) +
        "&select=*&order=id.desc",

        {
          headers:{
            ...authHeaders()
          }
        }
      );

    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }

    const orders =
      await response.json();

    if(!Array.isArray(orders) || !orders.length){

      container.innerHTML =
        "Aucune commande pour le moment.";

      return;
    }

    container.innerHTML = "";

    orders.forEach(order => {

      const total =
        Number(order.total) || 0;

      const status =
        order.status || "pending";

      const card =
        document.createElement("div");

      card.className =
        "orderCard";

      card.innerHTML =

        "<strong>Commande #" +
        escapeHtml(order.id) +
        "</strong><br>" +

        "Total : " +
        escapeHtml(formatPrice(total)) +
        "<br>" +

        "Statut : " +
        escapeHtml(status);

      container.appendChild(card);

    });

  }catch(error){

    console.error(
      "Erreur commandes :",
      error
    );

    container.innerHTML =
      "Impossible de charger les commandes.";

  }

}/* =========================
   TABLEAU DE BORD
========================= */

async function updateDashboard(){

  if(!accessToken || !currentUser){
    return;
  }

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/orders?user_id=eq." +
        encodeURIComponent(currentUser.id) +
        "&select=id",

        {
          headers:{
            ...authHeaders()
          }
        }
      );

    if(!response.ok){
      throw new Error(
        await response.text()
      );
    }

    const orders =
      await response.json();

    const now =
      new Date();

    const startOfDay =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      ).getTime();

    const endOfDay =
      startOfDay +
      24 * 60 * 60 * 1000;

    const todayOrders =
      Array.isArray(orders)
        ? orders.filter(order => {

            const orderTime =
              Number(order.id);

            return (
              orderTime >= startOfDay &&
              orderTime < endOfDay
            );

          })
        : [];

    const salesToday =
      todayOrders.length;

    const salesElement =
      document.getElementById(
        "todaySales"
      );

    const messageElement =
      document.getElementById(
        "goalMessage"
      );

    if(salesElement){

      salesElement.innerText =
        salesToday +
        " / " +
        DAILY_GOAL;

    }

    if(messageElement){

      if(salesToday >= DAILY_GOAL){

        messageElement.innerText =
          "Objectif du jour atteint ! 🎉";

      }else{

        const remaining =
          DAILY_GOAL -
          salesToday;

        messageElement.innerText =
          "Encore " +
          remaining +
          " vente" +
          (remaining > 1 ? "s" : "") +
          " pour atteindre ton objectif.";

      }

    }

    await loadProfile();

  }catch(error){

    console.error(
      "Erreur tableau de bord :",
      error
    );

  }

}/* =========================
   INITIALISATION
========================= */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    if(accessToken && currentUser){

      showLoggedIn();

      await loadProfile();

      await loadProducts();

      await loadOrders();

      await updateDashboard();

    }else{

      showLoggedOut();

      await loadProducts();

    }

  }
);
